name: Temporary Cloudflare email destination setup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/email-destination-setup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add public alias as a verified-destination candidate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o response.json -w '%{http_code}' --max-time 20             -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/email/routing/addresses"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data '{"email":"info@reframe-web.org"}' || true)"
          echo "HTTP_STATUS=$code"
          node - <<'NODE'
          const fs = require("fs");
          let payload = {};
          try { payload = JSON.parse(fs.readFileSync("response.json", "utf8")); } catch {}
          console.log("SUCCESS=" + Boolean(payload.success));
          if (payload.result && typeof payload.result === "object") {
            console.log("VERIFIED=" + Boolean(payload.result.verified));
          }
          for (const error of payload.errors || []) {
            console.log("ERROR_CODE=" + (error.code ?? "unknown"));
          }
          NODE
